<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – Supermercado E &amp; M</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Supermercado E &amp; M">
            <h1>Supermercado E &amp; M</h1>
            <p>Panel de Administración</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="usuario">👤 Usuario</label>
                <input type="text" id="usuario" name="usuario" required
                       placeholder="admin" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">🔒 Contraseña</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Ingresar al Panel</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-site">← Volver al sitio</a>
    </div>
</body>
</html>
